# ---------------------------------------------------------------------------
# Per-user field defaults — referenced inside catalog entries below
# ---------------------------------------------------------------------------
user_shell: /bin/bash
user_create_home: true
user_system: false
user_expires: -1
user_groups: []
user_default_admin_group: "admin"
user_default_config_group: "config"
user_admin_groups: ["{{ user_default_admin_group }}", "{{ user_default_config_group }}" ]
user_append_groups: true
user_password: "changeme"

# ---------------------------------------------------------------------------
# user_roles_default — global default per-user role set
# ---------------------------------------------------------------------------
root_roles_default:
  terminal_bash: true
  terminal_vim: true
  terminal_tmux: true
  terminal_scripts: true
  desktop_essentials: true

user_roles_default:
  terminal_bash: true
  terminal_vim: true
  terminal_nvim: true
  terminal_tmux: true
  terminal_kitty: true
  terminal_python: true
  terminal_rust: true
  terminal_scripts: true
  desktop_essentials: true
  desktop_lightdm: true
  desktop_rofi: true
  desktop_qtile: true
  desktop_thunar: true
  desktop_kanata: true
  backup_backup: true
  development_opencode: true
  development_lmstudio: true
  development_espidf: true
  development_dotnet: true
  development_java: true
  development_latex: true
  development_unity: true

user_roles_minimal:
  terminal_bash: true
  terminal_tmux: true
  terminal_vim: true
  terminal_python: true
  terminal_rust: true
  terminal_nvim: true
  terminal_scripts: true

# ---------------------------------------------------------------------------
# user_catalog — user catalog (empty by default, override per host)
# ---------------------------------------------------------------------------
# Example shape:
#
user_catalog:
  default_root:
    name: "root"
    comment: "root"
    password: "rootpass"
    home: /root
    group: "root"
    groups: "{{ user_groups }}"
    system: true
    shell: "{{ user_shell }}"
    create_home: "{{ user_create_home }}"
    expires: "{{ user_expires }}"
    append_groups: "{{ user_append_groups }}"
    user_roles: "{{ root_roles_default }}"

  deploy:
    name: "deploy"
    comment: "deploy"
    password: "deploypass"
    group: "deploy"
    groups: "{{ user_admin_groups }}"
    home: /home/deploy
    system: "{{ user_system }}"
    shell: "{{ user_shell }}"
    create_home: "{{ user_create_home }}"
    expires: "{{ user_expires }}"
    append_groups: "{{ user_append_groups }}"
    sudo:
      nopasswd: true
      group: true
    user_roles: "{{ user_roles_minimal }}"

  jb:
    name: "jb"
    comment: "jb"
    password: "jbpass"
    group: "jb"
    groups: "{{ user_admin_groups }}"
    home: /home/jb
    system: "{{ user_system }}"
    shell: "{{ user_shell }}"
    create_home: "{{ user_create_home }}"
    expires: "{{ user_expires }}"
    append_groups: "{{ user_append_groups }}"
    sudo:
      nopasswd: false
      group: true
      macros:
        - ADMIN_DEFAULT
        - ADMIN_DEBUG
    user_roles: "{{ user_roles_default }}"
  
# ---------------------------------------------------------------------------
# user_list — per-host/per-group assignment list (empty by default)
# ---------------------------------------------------------------------------
# Example shape:
#
user_list:
  - name: default_root
    state: present
  - name: jb
    state: present
  - name: deploy
    state: present

