# --- srv inventory ---
# dsktest — in-place apply (this machine, connection local)
# srvtest — ssh-applied server
# Pick a subset by passing --limit through the justfile:
#   just bootstrap srv --limit local    # dsktest only
#   just bootstrap srv --limit srv       # srvtest only
#   just bootstrap srv --limit dsktest,srvtest

[local]
dsktest ansible_host=localhost ansible_connection=local

[srv]
srvtest